; Host-level DEFAULT config — host-wide settings, one [default] section per host.
;
; This file is the committed, tracked default: ema reads it as a fallback, so a
; plain checkout works without any copy step. The optional git-ignored override
; etc/ema.conf (a sibling of etc/reuter.ini — the system /etc is not consulted)
; carries host-specific values and is merged over this default. Unlike
; reuter.ini (one [<dbname>] section per database), this file is host-wide:
; every instance ema provisions on this host reads it.
;
; ssl-ca is the CA the instance's server verifies CLIENT certificates against —
; the server half of a consumer's `REQUIRE X509` service account. Its value is
; an absolute path on this host (typically under the system /etc/ssl), chosen
; by the operator, who installs the CA out of band: ema records the path only
; and never copies certificate bytes. Resolution:
;   - absent (here and in the override) -> no CA: plain TCP, unchanged;
;   - empty in the override ("ssl-ca =") -> no CA, explicitly clearing a
;     defaulted value;
;   - present non-empty -> the CA path: it must be absolute (loud error
;     otherwise) and the file must exist at `ema create` time.
; EMA_SSL_CA overrides the key (tests, one-off runs).
;
; See doc/system/host-ssl-ca.md.

[default]
; ssl-ca = /etc/ssl/ema-ca.pem
