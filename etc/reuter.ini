; Reuter file — copy to etc/reuter.ini in your project and fill in values.
; etc/reuter.ini should be git-ignored (machine-specific credentials).
; Sections are keyed by database name. EMA_TARGET=local uses [local] (or a
; per-database [local:<dbname>] when present); any other EMA_TARGET resolves
; [<dbname>] by the database name (e.g. `ema mariadb mydb`).

[local]
SERVER=localhost
PORT=3306
DBNAME=mydb
DBMS=mariadb
ADMIN_PASSWORD=change_me
READER_PASSWORD=change_me
MYSQL_UNIX_PORT=/path/to/mysql.sock

; Example: a second local database on the dev sandbox socket.
[local:mydb2]
SERVER=localhost
PORT=3306
DBNAME=mydb2
DBMS=mariadb
ADMIN_PASSWORD=change_me
READER_PASSWORD=change_me
MYSQL_UNIX_PORT=/path/to/mysql.sock

; Example prod section (in consumer repos, generated per database by the
; framework's gen-reuter from etc/machines.ini + etc/deploy.conf).
[mydb]
SERVER=10.147.x.x
PORT=3306
DBNAME=mydb
DBMS=mariadb
ADMIN_PASSWORD=change_me
READER_PASSWORD=change_me
