; Reuter file — prod connectivity, one [<dbname>] section per database.
; In consumer repos this file is git-ignored and generated by gen-reuter from
; etc/machines.ini + etc/deploy.conf; this copy is a committed example of the
; prod shape. Local dev connections live in var/reuter.local.ini (generated
; by `ema init db <name>`), not here.
;
; Transport: MYSQL_UNIX_PORT is the DB host's local socket path (written by
; gen-reuter) so `ema init db <name>` run on the DB host connects as root over
; the socket; the app layer reads .env (not this key) and stays TCP-only.

[mydb]
SERVER=10.147.x.x
PORT=3306
DBMS=mariadb
ADMIN_PASSWORD=change_me
READER_PASSWORD=change_me
MYSQL_UNIX_PORT=/path/to/mysql.sock
