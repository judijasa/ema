; Reuter file — copy to src/reuter.ini in your project and fill in values.
; src/reuter.ini should be git-ignored (machine-specific credentials).
; Add one section per target. Set EMA_TARGET=<section> to select (default: local).

[local]
SERVER=localhost
PORT=3306
DBNAME=mydb
DBMS=mariadb
ADMIN_PASSWORD=change_me
READER_PASSWORD=change_me
MYSQL_UNIX_PORT=/path/to/mysql.sock

[prod]
SERVER=10.147.x.x
PORT=3306
DBNAME=mydb
DBMS=mariadb
ADMIN_PASSWORD=change_me
READER_PASSWORD=change_me
